name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build
        run: |
          set -eux
          if [ -x ./gradlew ]; then
            ./gradlew build --no-daemon
          elif [ -f pom.xml ]; then
            mvn -B -DskipTests package
          else
            echo "no gradle wrapper or pom.xml" >&2
            exit 1
          fi
          mkdir -p dist
          find . \( -path '*/target/*.jar' -o -path '*/build/libs/*.jar' \) -print | while read -r jar; do
            case "$jar" in
              *-sources.jar|*-javadoc.jar|*/original-*) ;;
              *) cp "$jar" dist/ ;;
            esac
          done
          test -n "$(find dist -name '*.jar' -print -quit)"
      - name: Fail if this tag already has release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            count="$(gh release view "$tag" --json assets --jq '.assets | length')"
            if [ "$count" != "0" ]; then
              echo "tag $tag already has $count asset(s); bump the version instead of overwriting" >&2
              exit 1
            fi
          fi

      - uses: softprops/action-gh-release@v2
        with:
          overwrite_files: false
          files: dist/*.jar
